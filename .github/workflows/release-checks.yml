name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bounded-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install bounded-test dependencies
        run: python -m pip install numpy==2.2.6 scipy scikit-learn

      - name: Run bounded unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile release-facing Python
        run: python -m compileall -q integrations/hgclr XMLmodels/CascadeXML htc/hbgl dataset_transfer tests

      - name: Check release-facing shell syntax
        shell: bash
        run: |
          find integrations/hgclr -type f \( -name '*.sh' -o -name '*.sbatch' \) -print0 \
            | xargs -0 -n1 bash -n
          bash -n XMLmodels/pecos/job_*.sh XMLmodels/pecos/run_ensemble/*.sh
          bash -n htc/hbgl/scripts/*.sh
