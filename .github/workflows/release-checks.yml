name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bounded-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install bounded-test dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Run bounded release checks
        run: bash scripts/check_release.sh
