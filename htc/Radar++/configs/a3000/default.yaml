# --- Experiment Setup ---
name: 'a3000 default'

# --- Dataset ---
dataset: 'a3000'
use_mixed_precision: True

f1_validation: True

# --- Model Variant ---
model_variant: 'radar'
tokenization_mode: 'xml'
loss: 'focal'
gamma: 2.0
label_smoothing: 0.1
decoding_strategy: 'greedy'
expansion: 'default'

# --- Model Configuration ---
# Encoder
encoder: 'roberta-base'
lr_encoder: 0.000035 #3.5e-5
max_length: 128
hidden_dim: 768
dropout: 0.2

# Decoder Settings
lr_decoder: 0.0003 #3e-4
embedding_size: 768 # for token embeddings
forward_expansion: 4 # decoder forward_expansion
nhead: 8 # number of attention heads within a decoder layer
decoder_layers: 2 

# --- Training Parameters ---
batch_size: 32
epochs: 15
accumulation_steps: 2 # gradient accumulation

# Dataloading
shuffle: False
sample_factor: 0.2 # for validation steps between epochs we will only use a subset
num_workers: 8 # Careful

lr_patience: 3
patience: 3 # number of epochs

